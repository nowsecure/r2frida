name: r2plugin

on:
  push:
  workflow_dispatch: {}

jobs:
  make-r2git:
    name: Link r2frida statically in radare2 with make
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build radare2 from git with r2frida inside
        run: |
          git clone --depth=1 https://github.com/radareorg/radare2.git
          cd radare2
          cp -f ../r2plugin/config.mk libr/xps/config.mk
          git clone .. libr/xps/p/r2frida
          make -C libr/xps/p/r2frida/r2plugin
          make -C libr/xps
          ./configure --prefix=/usr
          make -j
          sudo make install
      - name: Test if r2plugin is available
        run: |
          r2 -L | grep frida
          r2 -q -c 'Lc~r2frida' -- | grep r2frida

  meson-r2git:
    name: Link r2frida statically in radare2 with meson
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential meson ninja-build pkg-config libzip-dev zlib1g-dev
      - name: Build radare2 from git with r2frida inside
        run: |
          git clone --depth=1 https://github.com/radareorg/radare2.git
          cd radare2
          cp -f ../r2plugin/config.mk libr/xps/config.mk
          git clone .. libr/xps/p/r2frida
          make -C libr/xps
          meson setup b --prefix=/usr -Duse_sys_zip=true
          meson compile -C b
          sudo meson install -C b
      - name: Test if r2plugin is available
        run: |
          r2 -L | grep frida
          r2 -q -c 'Lc~r2frida' -- | grep r2frida
